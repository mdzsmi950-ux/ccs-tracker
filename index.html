<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CCS Tracker</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#f4f6f8;color:#17191d}.msg{max-width:760px;margin:40px auto;background:#fff;border:1px solid #dfe4ea;border-radius:12px;padding:22px;box-shadow:0 3px 16px rgba(18,35,58,.06)}.err{color:#9a2626;white-space:pre-wrap}</style></head><body><div id="loading" class="msg">Loading CCS tracker…</div><script>(async()=>{try{const files=['data/app-v17-prefix.txt','data/app-v17.txt'];let b64='';for(const f of files){const r=await fetch(f+'?v=17',{cache:'no-store'});if(!r.ok)throw new Error('Failed to fetch '+f+' ('+r.status+')');b64+=(await r.text()).replace(/\s+/g,'')}if(b64.length%4!==0)throw new Error('Tracker payload length is invalid: '+b64.length);const bin=atob(b64);const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();if(!html.startsWith('<!doctype html>'))throw new Error('Decoded tracker payload is not HTML');document.open();document.write(html);document.close()}catch(e){const el=document.getElementById('loading');el.className='msg err';el.textContent='Could not load tracker: '+e+'\n\nThe loader has been repaired. If you are seeing this after the newest Pages deployment, send me this exact error.'}})()</script></body></html>
