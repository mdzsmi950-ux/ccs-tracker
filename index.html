<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CCS Tracker</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#f4f6f8;color:#17191d}.msg{max-width:760px;margin:40px auto;background:#fff;border:1px solid #dfe4ea;border-radius:12px;padding:22px;box-shadow:0 3px 16px rgba(18,35,58,.06)}.err{color:#9a2626;white-space:pre-wrap}</style></head><body><div id="loading" class="msg">Loading CCS tracker…</div><script>(async()=>{try{const files=['data/part1.txt','data/part2.txt'];const chunks=[];let total=0;for(const f of files){let s=(await(await fetch(f,{cache:'no-store'})).text()).replace(/\s+/g,'');const bin=atob(s);const a=Uint8Array.from(bin,c=>c.charCodeAt(0));chunks.push(a);total+=a.length}const joined=new Uint8Array(total);let off=0;for(const a of chunks){joined.set(a,off);off+=a.length}const stream=new Blob([joined]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();document.open();document.write(html);document.close()}catch(e){const el=document.getElementById('loading');el.className='msg err';el.textContent='Could not load tracker: '+e+'\n\nTry a hard refresh. If this persists, the saved tracker payload itself needs to be rebuilt.'}})()</script></body></html>
