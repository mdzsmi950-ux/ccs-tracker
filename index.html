<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CCS Tracker</title></head><body><div id="loading" style="font-family:system-ui;padding:24px">Loading CCS tracker…</div><script>(async()=>{const files=['data/part1.txt','data/part2.txt'];let b64='';for(const f of files){b64+=await (await fetch(f)).text()}const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));const stream=new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();document.open();document.write(html);document.close()})().catch(e=>{document.getElementById('loading').textContent='Could not load tracker: '+e})</script></body></html>
