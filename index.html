<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CCS Tracker</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#f4f6f8;color:#17191d}.msg{max-width:760px;margin:40px auto;background:#fff;border:1px solid #dfe4ea;border-radius:12px;padding:22px;box-shadow:0 3px 16px rgba(18,35,58,.06)}.err{color:#9a2626;white-space:pre-wrap}iframe.payload{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}</style></head><body><div id="loading" class="msg">Loading CCS tracker…</div><script>(async()=>{try{function loadText(url){return new Promise((resolve,reject)=>{const f=document.createElement('iframe');f.className='payload';f.src=url+(url.includes('?')?'&':'?')+'v=28';f.onload=()=>{try{const t=(f.contentDocument&&f.contentDocument.body?f.contentDocument.body.textContent:'');f.remove();if(!t)reject(new Error('Empty payload: '+url));else resolve(t)}catch(e){reject(new Error('Could not read '+url+': '+e.message))}};f.onerror=()=>reject(new Error('Could not load '+url));document.body.appendChild(f)})}async function decodeGzipB64(text){const s=text.replace(/\s+/g,'');const bin=atob(s);const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));if(typeof DecompressionStream==='undefined')throw new Error('This browser does not support DecompressionStream');const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));return await new Response(stream).text()}const [p1,p2,audit64,overridesText]=await Promise.all([loadText('data/app-v17-prefix.txt'),loadText('data/app-v17.txt'),loadText('data/audit-v21.txt'),loadText('data/overrides-v27.json')]);let html=await decodeGzipB64(p1.replace(/\s+/g,'')+p2.replace(/\s+/g,''));if(!html.startsWith('<!doctype html>'))throw new Error('Decoded tracker app is not HTML');const data=JSON.parse(await decodeGzipB64(audit64));const overrides=JSON.parse(overridesText);for(const o of overrides.items||[]){for(const b of data.boxes||[]){if(b.date!==o.date)continue;for(const i of b.items||[]){if(!String(i.product||'').includes(o.productContains))continue;Object.assign(i,o.set||{});if(o.note)i.notes=((i.notes||'')+' '+o.note).trim()}}}data.unmatchedMarketplaceItems=overrides.unmatchedMarketplaceItems||[];data.ignoredNonCCSMarketplaceItems=overrides.ignoredNonCCSItems||[];for(const b of data.boxes||[]){const sum=(b.items||[]).filter(i=>i.retailPrice!==''&&i.retailPrice!=null&&Number.isFinite(Number(i.retailPrice))).reduce((s,i)=>s+Number(i.retailPrice),0);b.auditedItemRetailSubtotal=Math.round(sum*100)/100;if(b.advertisedRetail!==''&&b.advertisedRetail!=null){b.totalRetailValue=Number(b.advertisedRetail);b.totalRetailBasis='CCS advertised bundle value'}else{b.totalRetailValue=Math.round(sum*100)/100;b.totalRetailBasis='Sum of item retail values'}}data.version=28;data.appVersion='28-no-fetch-loader';data.facebookMarketplaceAuditAsOf='2026-08-08';if(data.retailAudit){const items=(data.boxes||[]).flatMap(b=>b.items||[]);const priced=items.filter(i=>i.retailPrice!==''&&i.retailPrice!=null&&Number.isFinite(Number(i.retailPrice)));data.retailAudit.pricedItemRows=priced.length;data.retailAudit.unresolvedItemRows=items.length-priced.length;data.retailAudit.itemizedRetailSubtotal=Math.round(priced.reduce((s,i)=>s+Number(i.retailPrice),0)*100)/100;data.retailAudit.totalRetailValueUnderOrderRule=Math.round((data.boxes||[]).reduce((s,b)=>s+Number(b.totalRetailValue||0),0)*100)/100}const audit=JSON.stringify(data);const safeAudit=audit.replace(/<\//g,'<\\/');const re=/<script id="embedded-data" type="application\/json">[\s\S]*?<\/script>/;if(!re.test(html))throw new Error('Embedded tracker data block not found');html=html.replace(re,'<script id="embedded-data" type="application/json">'+safeAudit+'<\/script>');html=html.replaceAll('ccsTrackerClearUI','ccsTrackerClearUI-v28');const override=`<script>boxRetail=function(b){const items=b.items||[],priced=items.filter(i=>has(i.retailPric
