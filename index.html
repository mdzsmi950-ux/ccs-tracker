<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CCS Tracker</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#f4f6f8;color:#17191d}.msg{max-width:760px;margin:40px auto;background:#fff;border:1px solid #dfe4ea;border-radius:12px;padding:22px;box-shadow:0 3px 16px rgba(18,35,58,.06)}.err{color:#9a2626;white-space:pre-wrap}</style></head><body><div id="loading" class="msg">Loading CCS tracker…</div><script>(async()=>{try{async function decodeGzipB64(text){const s=text.replace(/\s+/g,'');const bin=atob(s);const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));return await new Response(stream).text()}let app64='';for(const f of ['data/app-v17-prefix.txt','data/app-v17.txt']){const r=await fetch(f+'?v=25',{cache:'no-store'});if(!r.ok)throw new Error('Failed to fetch '+f+' ('+r.status+')');app64+=(await r.text()).replace(/\s+/g,'')}let html=await decodeGzipB64(app64);if(!html.startsWith('<!doctype html>'))throw new Error('Decoded tracker payload is not HTML');const ar=await fetch('data/audit-v21.txt?v=25',{cache:'no-store'});if(!ar.ok)throw new Error('Failed to fetch audited tracker data ('+ar.status+')');const audit=await decodeGzipB64(await ar.text());JSON.parse(audit);const safeAudit=audit.replace(/<\//g,'<\\/');const re=/<script id="embedded-data" type="application\/json">[\s\S]*?<\/script>/;if(!re.test(html))throw new Error('Embedded tracker data block not found');html=html.replace(re,'<script id="embedded-data" type="application/json">'+safeAudit+'<\/script>');html=html.replaceAll('ccsTrackerClearUI','ccsTrackerClearUI-v25');const override=`<script>boxRetail=function(b){const items=b.items||[],priced=items.filter(i=>has(i.retailPrice)),sum=priced.reduce((s,i)=>s+Number(i.retailPrice),0);if(has(b.advertisedRetail))return {value:Number(b.advertisedRetail),source:'CCS advertised bundle value',missing:items.length-priced.length,itemSum:sum};return {value:sum,source:'sum of item retail values',missing:items.length-priced.length,itemSum:sum}};renderAll();<\/script>`;html=html.replace('</body>',override+'</body>');document.open();document.write(html);document.close()}catch(e){const el=document.getElementById('loading');el.className='msg err';el.textContent='Could not load tracker: '+e+'\n\nThis build loads the audited retail dataset directly from GitHub.'}})()</script></body></html>
