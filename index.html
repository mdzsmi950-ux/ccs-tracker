<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CCS Tracker</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#f4f6f8;color:#17191d}.msg{max-width:760px;margin:40px auto;background:#fff;border:1px solid #dfe4ea;border-radius:12px;padding:22px;box-shadow:0 3px 16px rgba(18,35,58,.06)}.err{color:#9a2626;white-space:pre-wrap}</style></head><body><div id="loading" class="msg">Loading CCS tracker…</div><script>(async()=>{try{async function decodeGzipB64(text){const s=text.replace(/\s+/g,'');const bin=atob(s);const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));return await new Response(stream).text()}let app64='';for(const f of ['data/app-v17-prefix.txt','data/app-v17.txt']){const r=await fetch(f+'?v=27',{cache:'no-store'});if(!r.ok)throw new Error('Failed to fetch '+f+' ('+r.status+')');app64+=(await r.text()).replace(/\s+/g,'')}let html=await decodeGzipB64(app64);if(!html.startsWith('<!doctype html>'))throw new Error('Decoded tracker payload is not HTML');const ar=await fetch('data/audit-v21.txt?v=27',{cache:'no-store'});if(!ar.ok)throw new Error('Failed to fetch audited tracker data ('+ar.status+')');const auditText=await decodeGzipB64(await ar.text());const data=JSON.parse(auditText);const or=await fetch('data/overrides-v27.json?v=27',{cache:'no-store'});if(!or.ok)throw new Error('Failed to fetch tracker overrides ('+or.status+')');const overrides=await or.json();for(const o of overrides.items||[]){for(const b of data.boxes||[]){if(b.date!==o.date)continue;for(const i of b.items||[]){if(!String(i.product||'').includes(o.productContains))continue;Object.assign(i,o.set||{});if(o.note){i.notes=((i.notes||'')+' '+o.note).trim()}}}}for(const b of data.boxes||[]){const sum=(b.items||[]).filter(i=>i.retailPrice!==''&&i.retailPrice!=null&&Number.isFinite(Number(i.retailPrice))).reduce((s,i)=>s+Number(i.retailPrice),0);b.auditedItemRetailSubtotal=Math.round(sum*100)/100;if(b.advertisedRetail!==''&&b.advertisedRetail!=null){b.totalRetailValue=Number(b.advertisedRetail);b.totalRetailBasis='CCS advertised bundle value'}else{b.totalRetailValue=Math.round(sum*100)/100;b.totalRetailBasis='Sum of item retail values'}}data.version=27;data.appVersion='27-facebook-listings-corrected';data.facebookMarketplaceAuditAsOf='2026-08-08';if(data.retailAudit){const items=(data.boxes||[]).flatMap(b=>b.items||[]);data.retailAudit.pricedItemRows=items.filter(i=>i.retailPrice!==''&&i.retailPrice!=null&&Number.isFinite(Number(i.retailPrice))).length;data.retailAudit.unresolvedItemRows=items.length-data.retailAudit.pricedItemRows;data.retailAudit.itemizedRetailSubtotal=Math.round(items.filter(i=>i.retailPrice!==''&&i.retailPrice!=null&&Number.isFinite(Number(i.retailPrice))).reduce((s,i)=>s+Number(i.retailPrice),0)*100)/100;data.retailAudit.totalRetailValueUnderOrderRule=Math.round((data.boxes||[]).reduce((s,b)=>s+Number(b.totalRetailValue||0),0)*100)/100}const audit=JSON.stringify(data);const safeAudit=audit.replace(/<\//g,'<\\/');const re=/<script id="embedded-data" type="application\/json">[\s\S]*?<\/script>/;if(!re.test(html))throw new Error('Embedded tracker data block not found');html=html.replace(re,'<script id="embedded-data" type="application/json">'+safeAudit+'<\/script>');html=html.replaceAll('ccsTrackerClearUI','ccsTrackerClearUI-v27');const override=`<script>boxRetail=function(b){const items=b.items||[],priced=items.filter(i=>has(i.retailPrice)),sum=priced.reduce((s,i)=>s+Number(i.retailPrice),0);if(has(b.advertisedRetail))return {value:Number(b.advertisedRetail),source:'CCS advertised bundle value',missing:items.length-priced.length,itemSum:sum};return {value:sum,source:'sum of item retail values',missing:items.length-priced.length,itemSum:sum}};renderAll();<\/script>`;html=html.replace('</body>',override+'</body>');document.open();document.write(html);document.close()}catch(e){const el=document.getElementById('loading');el.className='msg err';el.textContent='Could not load tracker: '+e+'\n\nThis build loads the audited retail dataset and Facebook Marketplace overrides directly from GitHub.'}})()</script></body></html>
